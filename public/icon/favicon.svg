<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5364"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E63946" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Monogram T -->
  <!-- Top horizontal bar -->
  <path d="M14 18 C14 16.34 15.34 15 17 15 L43 15 C44.66 15 46 16.34 46 18 C46 19.66 44.66 21 43 21 L33.5 21 L33.5 46 C33.5 47.66 32.16 49 30.5 49 C28.84 49 27.5 47.66 27.5 46 L27.5 21 L17 21 C15.34 21 14 19.66 14 18 Z" fill="#FFFFFF"/>

  <!-- Signature ThisKitchen brand dot with glow -->
  <circle cx="49" cy="45" r="5" fill="url(#dotGrad)" filter="url(#glow)"/>
</svg>
